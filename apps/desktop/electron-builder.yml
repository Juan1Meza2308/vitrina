# Empaquetado de la app de escritorio.
#
# Ojo: un .app o un .dmg de macOS SOLO se pueden generar desde macOS —
# electron-builder necesita las herramientas del sistema. Desde Windows este
# fichero se puede validar con `--win --dir`, que comprueba lo que de verdad
# suele romperse: que las dependencias nativas entren en el paquete.
appId: dev.vitrina.app
productName: Vitrina
copyright: MIT

# Version exacta y explicita. En un workspace de npm, electron esta izado a la
# raiz y declarado como rango, asi que electron-builder no puede resolverla
# sola. Hay que subirla junto con la devDependencia de electron.
electronVersion: 44.0.0

directories:
  output: ../../dist
  # El icono se genera con `node tools/icono.ts`. De este PNG de 1024
  # electron-builder saca solo el .ico de Windows y el .icns de macOS.
  buildResources: build

# De donde se baja la actualizacion. Es tambien lo que hace que el build
# escriba `latest.yml` en la Release: sin ese fichero, electron-updater no tiene
# como saber que hay una version nueva.
# Se comprueba que ffmpeg entro de verdad, y con los codecs que hacen falta.
# electron-builder, si un extraResources no esta, avisa en el log y SIGUE: sin
# esto se publicaria un instalador sin exportador.
# La ruta va desde donde se ejecuta el comando (la raiz del repo), no desde
# `projectDir` como el resto del fichero. Es una rareza de electron-builder, y
# cuesta un rato averiguarla: el error dice "Cannot find module" y no donde
# buscaba.
afterPack: apps/desktop/build/comprobar-empaquetado.cjs

publish:
  provider: github
  owner: Juan1Meza2308
  repo: vitrina
  # BORRADOR, y la publica el flujo al final.
  #
  # No es una preferencia: una Release publicada exige un tag que todavia no
  # existe cuando se sube el primer fichero, y electron-builder lanza un
  # publicador POR FICHERO. Los dos intentaban crearla a la vez y el segundo se
  # estrellaba contra un 422 «Published releases must have a valid tag» —paso en
  # la v0.1.0 y otra vez en la v0.1.1—. Un borrador no necesita tag.
  #
  # El flujo la crea antes de compilar y la publica al final, cuando ha
  # comprobado que estan todos los ficheros. Si un build falla, se queda en
  # borrador: nadie se descarga media version.
  releaseType: draft

files:
  - out/**/*
  - package.json

# El binario nativo de canvas no puede ir dentro del asar: se carga con
# `process.dlopen`, que necesita un fichero real en disco.
asarUnpack:
  - '**/node_modules/@napi-rs/canvas*/**'

# ffmpeg viaja CON la app, en los recursos y no dentro del asar: se ejecuta como
# proceso aparte, y un ejecutable dentro de un archivo empaquetado no se puede
# lanzar. `findFfmpeg()` lo busca ahi antes que en ningun otro sitio.
#
# Va declarado por plataforma porque el nombre del binario cambia, y porque el
# de cada sistema solo aparece en el node_modules de esa maquina: cada instalador
# se compila en un runner de su sistema.

mac:
  category: public.app-category.developer-tools
  extraResources:
    - from: ../../node_modules/ffmpeg-static/ffmpeg
      to: ffmpeg
  # Las dos arquitecturas. `macos-latest` es Apple Silicon, asi que sin decirlo
  # solo sale el .dmg de arm64 y un Mac Intel se queda mirando un fichero que no
  # puede abrir —silenciosamente, ademas: la Release parece completa—. Se
  # publican dos ficheros en vez de uno universal porque un universal pesa lo que
  # los dos juntos y todo el mundo se descarga la mitad que no usa.
  #
  # El .zip no es un duplicado del .dmg: es lo que necesita el actualizador.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Sin firma: no hace falta cuenta de Apple Developer. La contrapartida es que
  # la primera apertura pide clic derecho -> Abrir, o quitar la cuarentena con
  # `xattr -dr com.apple.quarantine /Applications/Vitrina.app`.
  identity: null
  extendInfo:
    # macOS exige declarar para que se pide el microfono, o getUserMedia falla
    # sin explicacion.
    NSMicrophoneUsageDescription: >-
      Vitrina graba tu narracion mientras haces la demo.
    # Vitrina NO captura la pantalla: graba el compositor del navegador por
    # DevTools Protocol. Por eso no declara NSScreenCaptureUsageDescription ni
    # dispara el permiso de grabacion de pantalla.

win:
  target: nsis
  extraResources:
    - from: ../../node_modules/ffmpeg-static/ffmpeg.exe
      to: ffmpeg.exe

# El instalador deja elegir carpeta y crea acceso directo: un instalador que no
# pregunta nada asusta mas de lo que ahorra.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Vitrina
